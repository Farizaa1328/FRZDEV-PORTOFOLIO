<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="frz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <radialGradient id="frz-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#050508" />
  <circle cx="50" cy="50" r="45" fill="url(#frz-glow)" />
  <!-- Crimson Border -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#frz-grad)" stroke-width="3" stroke-opacity="0.8" />
  <!-- FRZ Typography -->
  <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="900" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" letter-spacing="-1">FRZ<tspan fill="#E11D48">.</tspan></text>
</svg>
